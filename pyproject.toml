[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vde-inspect"
version = "0.1.0"
description = "Native desktop workspace for vehicle-drone metro inspection"
requires-python = ">=3.13"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0"]

[project.scripts]
vde-inspect = "vde_inspect.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vde_inspect = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
